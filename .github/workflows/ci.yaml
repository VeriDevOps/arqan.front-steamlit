name: CI

on:
  pull_request:
    branches:
      - migration
  push:
    branches:
      - migration

env:
  IMAGE_NAME: arqan.streamlit-front

jobs:
  push-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Build Docker image
        run: docker build --tag ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Login to Docker registry
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_REGISTRY }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:migration
          docker push ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:migration